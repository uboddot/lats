<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- halo: white core bleeding into the blue glow used in star.css -->
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="rgb(23, 87, 151)" stop-opacity="0.85"/>
      <stop offset="0.65" stop-color="rgb(23, 87, 151)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="rgb(23, 87, 151)" stop-opacity="0"/>
    </radialGradient>

    <!-- spikes: thin lines that fade out at both ends -->
    <linearGradient id="spikeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spikeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- night sky -->
  <rect width="64" height="64" rx="12" fill="#000"/>

  <!-- constellation line -->
  <line x1="20" y1="44" x2="45" y2="19" stroke="aliceblue" stroke-width="1.1" stroke-opacity="0.75" stroke-linecap="round"/>

  <!-- big star, bottom left -->
  <g transform="translate(20 44)">
    <circle r="13" fill="url(#glow)"/>
    <rect x="-16" y="-0.8" width="32" height="1.6" fill="url(#spikeH)"/>
    <rect x="-0.8" y="-16" width="1.6" height="32" fill="url(#spikeV)"/>
    <circle r="3" fill="#fff"/>
  </g>

  <!-- small star, top right -->
  <g transform="translate(45 19)">
    <circle r="8" fill="url(#glow)"/>
    <rect x="-10.5" y="-0.6" width="21" height="1.2" fill="url(#spikeH)"/>
    <rect x="-0.6" y="-10.5" width="1.2" height="21" fill="url(#spikeV)"/>
    <circle r="1.9" fill="#fff"/>
  </g>
</svg>
